# =============================================================================
# RUNTIME INJECTION CONTRACT
# =============================================================================
runtime_contract:
  step_1_select_root:
    - "Select exactly one primary root tag whose type is in allow_primary_roots."
    - "Reject any tag in consequence_only_tags or matching forbid_primary_roots patterns."
  step_2_inject_root:
    - "Inject the root fault using calibrated magnitudes (IQR-based, not fixed global params)."
  step_3_propagate_if_clr:
    - "Only if root's default_profile is closed_loop_response AND an edge exists:"
    - "  Apply downstream perturbation = coeff * root_perturbation, delayed by fitted lag."
    - "  coeff and lag are fitted from normal training data via cross-correlation."
    - "  measurement_only roots: no propagation."
  step_4_validate:
    - "No negative flows, impossible pressures, or non-monotone cumulative totals."

reviewer_risk_flags:
  - "Injecting CO/SP/SPEED/FQ tags as primary fault roots."
  - "Correlation-based co-injection instead of causal propagation."
  - "Freezing sensors at arbitrary percentiles instead of last-valid value."
  - "Long clean NaN blocks without evidence WADI logs outages that way."
  - "Directly corrupting sibling analyzers for a single analyzer fault."
